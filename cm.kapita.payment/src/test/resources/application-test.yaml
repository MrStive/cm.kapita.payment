---
spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: "jdbc:h2:mem:payment-test-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false"
    username: "sa"
    password: ""
    driver-class-name: "org.h2.Driver"
  jpa:
    show-sql: false
    generate-ddl: false
    properties:
      eclipselink.weaving: "false"
      eclipselink.ddl-generation: "none"
      eclipselink.target-database: "org.eclipse.persistence.platform.database.H2Platform"
      eclipselink.logging.level: "WARNING"
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"
    contexts: "test"
eureka:
  client:
    enabled: false
kapita:
  messaging:
    payment-status:
      topic: "test.payment.status.updated"
  security:
    expose-docs: true
